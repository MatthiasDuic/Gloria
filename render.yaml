services:
  - type: web
    name: gloria-stream-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: worker
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    maxShutdownDelaySeconds: 300
    disk:
      name: gloria-report-outbox
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GLORIA_OUTBOX_DIR
        value: /var/data/gloria-outbox
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: OPENAI_API_KEY
        sync: true
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_REASONING_EFFORT
        value: low
      - key: OPENAI_REALTIME_SILENCE_MS
        value: "350"
      - key: ELEVENLABS_API_KEY
        sync: true
      - key: ELEVENLABS_VOICE_ID
        value: Ywa4Py8gVz5ugeNVy6iC
      - key: ELEVENLABS_MODEL
        value: eleven_v4_turbo
      - key: ELEVENLABS_FALLBACK_MODEL
        value: eleven_multilingual_v2
      - key: ELEVENLABS_STABILITY
        value: "0.38"
      - key: ELEVENLABS_SIMILARITY
        value: "0.84"
      - key: ELEVENLABS_STYLE
        value: "0.36"
      - key: ELEVENLABS_SPEED
        value: "0.96"
      - key: ELEVENLABS_SPEAKER_BOOST
        value: "true"
      - key: TELNYX_STREAM_BIDIRECTIONAL_CODEC
        value: PCMA
      - key: APP_BASE_URL
        value: https://gloria.agentur-duic-sprockhoevel.de
      - key: APP_INTERNAL_TOKEN
        sync: false
      - key: TRANSFER_PHONE
        value: "+491715358989"
