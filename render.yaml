services:
  - type: web
    name: gloria-stream-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: worker
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: STREAM_SHARED_SECRET
        value: 8a2d5f3b1c9e7d4a6f2b8e1d5c3a9f7e1b4d8c2a5f9e3d7c1a6b8f2e4d9c3
      - key: OPENAI_API_KEY
        sync: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_REASONING_EFFORT
        value: low
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_REALTIME_SPEED
        value: 0.88
      - key: OPENAI_REALTIME_VAD_EAGERNESS
        value: low
      - key: TELNYX_STREAM_BIDIRECTIONAL_CODEC
        value: PCMA
      - key: APP_BASE_URL
        value: https://gloria.agentur-duic-sprockhoevel.de
      - key: APP_INTERNAL_TOKEN
        value: b1430199e0c004272791ddb04c35fe2327dab2e663f4c273a9fdadd190e961ae
      - key: TRANSFER_PHONE
        value: "+491715358989"
