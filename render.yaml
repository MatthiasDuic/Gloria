services:
  - type: web
    name: gloria-stream-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: worker
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: STREAM_SHARED_SECRET
        value: 8a2d5f3b1c9e7d4a6f2b8e1d5c3a9f7e1b4d8c2a5f9e3d7c1a6b8f2e4d9c3
      - key: OPENAI_API_KEY
        sync: true
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: LLM_TRANSCRIPT_TURNS
        value: 10
      - key: LLM_MAX_TOKENS
        value: 115
      - key: LLM_TIMEOUT_MS
        value: 7600
      - key: LLM_EARLY_FLUSH_CHARS
        value: 34
      - key: DEEPGRAM_API_KEY
        sync: true
      - key: DEEPGRAM_MODEL
        value: nova-3
      - key: DEEPGRAM_LANGUAGE
        value: de
      - key: DEEPGRAM_KEYTERMS
        value: "Duic,Matthias Duic,Sprockhoevel"
      - key: DEEPGRAM_VOICE_MODEL
        value: aura-helios-en
      - key: DEEPGRAM_ENDPOINTING_MS
        value: 420
      - key: DEEPGRAM_UTTERANCE_END_MS
        value: 760
      - key: ASR_FINAL_COALESCE_MS
        value: 1050
      - key: ASR_UTTERANCE_END_GRACE_MS
        value: 700
      - key: APP_BASE_URL
        value: https://gloria.agentur-duic-sprockhoevel.de
      - key: APP_INTERNAL_TOKEN
        value: b1430199e0c004272791ddb04c35fe2327dab2e663f4c273a9fdadd190e961ae
      - key: TRANSFER_PHONE
        value: "+491715358989"
